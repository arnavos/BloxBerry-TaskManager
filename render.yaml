services:
  - type: web
    name: bloxberry-labs-pm
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: DEPLOY_COMMANDS_ON_BOOT
        value: "true"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
